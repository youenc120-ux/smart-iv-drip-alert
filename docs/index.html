<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="點滴警報">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>點滴警報</title>
<style>
:root{
  --bg:#eef2f7;--card:#fff;--ink:#1c2430;--sub:#5b6676;--line:#e3e8ef;--blue:#1565c0;--blue-soft:#e3eefb;
  --ok:#2e9d5b;--ok-ink:#1e7a45;--warn:#e09400;--warn-ink:#8a5a00;--bad:#d63031;--bad-ink:#b3261e;
  --fault:#6c5ce7;--fault-ink:#5040c8;--radius:16px;--primary:#1565c0;--top:#1565c0
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141b;--card:#1a212b;--ink:#e8edf3;--sub:#9aa5b3;--line:#2a3340;--blue:#7fb2f5;--blue-soft:#1d2b3f;
  --primary:#2a66b8;--top:#123a6b;
  --ok-ink:#5fd08f;--warn-ink:#f2b84b;--bad-ink:#ff7b72;--fault-ink:#a99cff
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--top);color:#fff;
  padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
.top svg{width:24px;height:24px}
main{max-width:480px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:0 1px 3px #0000000f}
h2{font-size:17px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.step{display:flex;gap:14px;align-items:flex-start}
.badge{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.badge.done{background:var(--ok);color:#fff}
.step-body{flex:1;min-width:0}
ol.how{margin:10px 0 0;padding-left:20px;color:var(--sub);font-size:15px}
ol.how li{margin:6px 0}
.inline-i{display:inline-flex;vertical-align:-4px;color:var(--blue)}
.btn{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;min-height:48px;padding:12px 16px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:12px;text-decoration:none;
  transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.primary{background:var(--primary);color:#fff}
.ghost{background:var(--blue-soft);color:var(--blue)}
.small{width:auto;min-height:44px;margin:0;padding:8px 14px;font-size:15px}
.danger{background:transparent;color:var(--bad-ink)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.field{display:flex;gap:8px}
input{font:inherit;font-size:17px;flex:1;min-width:0;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.help{font-size:13px;color:var(--sub);margin:6px 0 0}
.err{font-size:14px;color:var(--bad-ink);margin:6px 0 0}
.err:empty{display:none}
.dev{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.dev:first-of-type{margin-top:12px}
.dev .name{flex:1 1 100%;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dev .name b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev .btn.small{flex:1}
.pill{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.ok-ink{color:var(--ok-ink)}.warn-ink{color:var(--warn-ink)}
.bed{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  border-left:6px solid var(--c);box-shadow:0 1px 3px #0000000f;text-decoration:none;color:inherit;min-height:44px}
.bed .i{width:26px;height:26px;color:var(--c);margin-top:2px}
.bed b{font-size:17px}
.bed .state{font-weight:700;color:var(--ci)}
.bed.empty{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #d6303140}}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px}
.section-title h2{font-size:15px;color:var(--sub);font-weight:600;margin:0}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0;padding-top:0}
.log time{color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums;flex:none;min-width:44px}
.log .i{color:var(--c);width:18px;height:18px;margin-top:3px}
.empty-note{color:var(--sub);text-align:center;padding:8px 0;margin:0}
.foot{color:var(--sub);font-size:13px;text-align:center;margin:24px 8px 0}
.foot a{color:var(--blue)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
</svg>

<header class="top">
  <svg class="i" aria-hidden="true"><use href="#i-drop"/></svg>
  <h1>點滴警報</h1>
</header>

<main>
  <!-- 步驟 1：iPhone 加入主畫面 -->
  <section class="card step" id="stepInstall" hidden>
    <span class="badge">1</span>
    <div class="step-body">
      <h2>加入主畫面</h2>
      <p class="sub">iPhone 必須從主畫面開啟，才能接收推播（iOS 16.4 以上）。</p>
      <ol class="how">
        <li>點 Safari 下方的 <span class="inline-i"><svg class="i"><use href="#i-share"/></svg></span>「分享」</li>
        <li>選擇 <span class="inline-i"><svg class="i"><use href="#i-plus"/></svg></span>「加入主畫面」</li>
        <li>回到主畫面，點「點滴警報」圖示開啟</li>
      </ol>
    </div>
  </section>

  <!-- 步驟 2：開啟通知 -->
  <section class="card step" id="stepPush">
    <span class="badge" id="pushBadge">2</span>
    <div class="step-body">
      <h2 id="pushTitle">開啟推播通知</h2>
      <p class="sub" id="pushDesc">點滴偏低或耗盡時，即使手機鎖定也會跳出通知。</p>
      <button class="btn primary" id="pushBtn" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-bell"/></svg><span>開啟推播</span>
      </button>
      <button class="btn ghost" id="testBtn" type="button" hidden>傳送本機測試通知</button>
      <p class="err" id="pushErr" role="alert"></p>
    </div>
  </section>

  <!-- 步驟 3：連結裝置 -->
  <section class="card step" id="stepDevices">
    <span class="badge" id="devBadge">3</span>
    <div class="step-body">
      <h2>連結點滴裝置</h2>
      <p class="sub">手機與裝置連上同一個 Wi-Fi，輸入裝置位址後按「連結」。</p>
      <label for="ipInput">裝置位址</label>
      <div class="field">
        <input id="ipInput" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.50">
        <button class="btn primary small" id="pairBtn" type="button">連結</button>
      </div>
      <p class="help">位址會顯示在 ESP32 的序列埠監控視窗。連結時會短暫跳到裝置頁面，完成後點左上角「完成」返回。</p>
      <p class="err" id="devErr" role="alert"></p>
      <div id="devList"></div>
    </div>
  </section>

  <div class="section-title"><h2>各床最新狀態</h2></div>
  <div id="beds" aria-live="polite"></div>

  <div class="section-title">
    <h2>推播紀錄</h2>
    <button class="btn danger small" id="clearBtn" type="button" hidden>清除</button>
  </div>
  <section class="card"><ul class="log" id="log"></ul></section>

  <p class="foot">本系統為專題原型，非醫療器材。<br>
    <a href="https://github.com/youenc120-ux/smart-iv-drip-alert">GitHub 原始碼</a></p>
</main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const DEMO = new URLSearchParams(location.search).has('demo');
const ST = {
  empty:  { label: '第二階段：請立即更換', c: 'var(--bad)',   ci: 'var(--bad-ink)',   sev: 4, icon: 'bell' },
  low:    { label: '第一階段：液量偏低',   c: 'var(--warn)',  ci: 'var(--warn-ink)',  sev: 3, icon: 'alert' },
  fault:  { label: '感測器異常',           c: 'var(--fault)', ci: 'var(--fault-ink)', sev: 2, icon: 'alert' },
  normal: { label: '液量充足',             c: 'var(--ok)',    ci: 'var(--ok-ink)',    sev: 0, icon: 'check' },
  test:   { label: '已連結',               c: 'var(--blue)',  ci: 'var(--blue)',      sev: -1, icon: 'link' },
};

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let devices = store.get('devices', []);   // [{ ip, ep }]：ep = 連結時使用的推播訂閱
let alerts = [];
let currentEndpoint = null;

function icon(name) { return `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function two(n) { return String(n).padStart(2, '0'); }
function clock(ms) { const d = new Date(ms); return `${two(d.getHours())}:${two(d.getMinutes())}`; }
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return '剛剛';
  if (s < 3600) return `${Math.floor(s / 60)} 分鐘前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小時前`;
  return `${Math.floor(s / 86400)} 天前`;
}
function b64ToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  s += '='.repeat((4 - (s.length % 4)) % 4);
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}
function alertTime(a) { return (a.t ? a.t * 1000 : 0) || a.received || Date.now(); }

// ===== 推播 =====
async function getSub() {
  if (!pushSupported) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}

async function enablePush() {
  $('pushErr').textContent = '';
  $('pushBtn').disabled = true;
  try {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) {
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(window.VAPID_PUBLIC_KEY) });
      }
    }
  } catch (e) {
    $('pushErr').textContent = '開啟失敗：' + e.message + '。請稍後再試一次。';
  }
  $('pushBtn').disabled = false;
  render();
}

async function testNotification() {
  const reg = await navigator.serviceWorker.ready;
  reg.showNotification('🔔 測試通知', { body: '通知功能正常，裝置警報會像這樣出現。', icon: 'icon-192.png', tag: 'iv-test' });
}

// ===== 裝置連結 =====
function normalizeIp(v) {
  return v.trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
}

async function pair(ip, unsub) {
  $('devErr').textContent = '';
  const sub = await getSub();
  if (!sub) {
    if (unsub) { devices = devices.filter((d) => d.ip !== ip); store.set('devices', devices); return render(); }
    $('devErr').textContent = '請先完成上一步「開啟推播」。';
    return;
  }
  const j = sub.toJSON();
  const h = new URLSearchParams({ e: j.endpoint, k: j.keys.p256dh, a: j.keys.auth, r: location.origin + location.pathname });
  if (unsub) {
    h.set('do', 'unsub');
    devices = devices.filter((d) => d.ip !== ip);
  } else {
    devices = devices.filter((d) => d.ip !== ip).concat({ ip, ep: j.endpoint });
  }
  store.set('devices', devices);
  // ESP32 只有 HTTP：用跳轉的方式把訂閱資料交給裝置（放在 # 後面，不會經過網路）
  location.href = `http://${ip}/pair#${h}`;
}

function onPairClick() {
  const ip = normalizeIp($('ipInput').value);
  if (!/^[a-z0-9.-]+(:\d+)?$/i.test(ip)) {
    $('devErr').textContent = '位址格式不正確，例如 192.168.1.50';
    $('ipInput').focus();
    return;
  }
  pair(ip, false);
}

// ===== 警報紀錄 =====
async function loadAlerts() {
  if (DEMO) return;
  try {
    const cache = await caches.open('iv-alerts');
    const res = await cache.match('alerts.json');
    alerts = res ? await res.json() : [];
  } catch { alerts = []; }
}

async function clearAlerts() {
  if (!confirm('確定要清除所有推播紀錄？')) return;
  try { await (await caches.open('iv-alerts')).delete('alerts.json'); } catch {}
  alerts = [];
  render();
}

function confirmedIps() {
  const set = new Set();
  for (const a of alerts) {
    const m = /^http:\/\/([^/]+)\//.exec(a.url || '');
    if (m) set.add(m[1]);
  }
  return set;
}

// ===== 畫面 =====
async function render() {
  // 步驟 1
  const needInstall = isIOS && !standalone;
  $('stepInstall').hidden = !needInstall;

  // 步驟 2
  const sub = await getSub().catch(() => null);
  currentEndpoint = sub ? sub.endpoint : null;
  const perm = 'Notification' in window ? Notification.permission : 'default';
  const on = !!sub && perm === 'granted';
  $('pushBadge').textContent = on ? '✓' : needInstall ? '2' : '1';
  $('pushBadge').classList.toggle('done', on);
  $('pushBtn').hidden = on;
  $('testBtn').hidden = !on;
  if (needInstall) {
    $('pushTitle').textContent = '開啟推播通知';
    $('pushDesc').textContent = '完成上一步、從主畫面開啟後，才能在這裡開啟推播。';
    $('pushBtn').disabled = true;
  } else if (!pushSupported) {
    $('pushTitle').textContent = '這個瀏覽器不支援推播';
    $('pushDesc').textContent = '請改用 iPhone 的 Safari（iOS 16.4 以上），或 Android 的 Chrome。';
    $('pushBtn').disabled = true;
  } else if (perm === 'denied') {
    $('pushTitle').textContent = '通知已被封鎖';
    $('pushDesc').textContent = isIOS ? '請到 iPhone「設定 → 通知 → 點滴警報」開啟「允許通知」。'
                                      : '請到瀏覽器的網站設定中允許通知，再重新整理這一頁。';
    $('pushBtn').disabled = true;
  } else if (on) {
    $('pushTitle').textContent = '推播已開啟';
    $('pushDesc').textContent = '這支手機可以接收點滴警報。';
  } else {
    $('pushTitle').textContent = '開啟推播通知';
    $('pushDesc').textContent = '點滴偏低或耗盡時，即使手機鎖定也會跳出通知。';
    $('pushBtn').disabled = false;
  }

  // 步驟 3
  const stepNo = needInstall ? 3 : 2;
  const confirmed = confirmedIps();
  const list = DEMO ? [{ ip: '192.168.1.50', ep: 'x' }, { ip: '192.168.1.51', ep: 'x' }] : devices;
  const okCount = list.filter((d) => confirmed.has(d.ip) && (DEMO || d.ep === currentEndpoint)).length;
  $('devBadge').textContent = okCount ? '✓' : String(stepNo);
  $('devBadge').classList.toggle('done', okCount > 0);
  $('devList').innerHTML = list.map((d) => {
    const stale = !DEMO && currentEndpoint && d.ep !== currentEndpoint;
    const ok = confirmed.has(d.ip) && !stale;
    const status = stale ? `<span class="pill warn-ink">${icon('alert')}需要重新連結</span>`
                 : ok ? `<span class="pill ok-ink">${icon('check')}已連結</span>`
                      : `<span class="pill warn-ink">${icon('clock')}等待測試通知</span>`;
    return `<div class="dev">
      <div class="name"><b>${esc(d.ip)}</b>${status}</div>
      <a class="btn ghost small" href="http://${esc(d.ip)}/" target="_blank" rel="noopener">即時監控</a>
      <button class="btn ${stale ? 'primary' : 'danger'} small" type="button" data-ip="${esc(d.ip)}" data-act="${stale ? 'relink' : 'unlink'}">${stale ? '重新連結' : '移除'}</button>
    </div>`;
  }).join('');

  // 各床最新狀態（以推播紀錄推算）
  const latest = new Map();
  for (const a of alerts) {
    if (a.state === 'test' || !ST[a.state]) continue;
    const prev = latest.get(a.bed);
    if (!prev || alertTime(a) > alertTime(prev)) latest.set(a.bed, a);
  }
  const beds = [...latest.values()].sort((x, y) => ST[y.state].sev - ST[x.state].sev || alertTime(y) - alertTime(x));
  $('beds').innerHTML = beds.length ? beds.map((a) => {
    const s = ST[a.state];
    const tag = a.url ? 'a' : 'div';
    const href = a.url && /^http:\/\/[^/]+\/$/.test(a.url) ? ` href="${esc(a.url)}" target="_blank" rel="noopener"` : '';
    return `<${tag} class="bed ${a.state}" style="--c:${s.c};--ci:${s.ci}"${href}>
      ${icon(s.icon)}
      <div><b>${esc(a.bed)}</b><div class="state">${s.label}</div>
      <p class="sub">${esc(a.body)}</p><p class="sub">${clock(alertTime(a))}・${ago(alertTime(a))}</p></div>
    </${tag}>`;
  }).join('') : `<section class="card"><p class="empty-note">尚未收到任何警報。<br>裝置偵測到液量變化時，會顯示在這裡。</p></section>`;

  // 推播紀錄
  $('clearBtn').hidden = DEMO || !alerts.length;
  $('log').innerHTML = alerts.length ? alerts.slice(0, 30).map((a) => {
    const s = ST[a.state] || ST.test;
    return `<li style="--c:${s.c}"><time>${clock(alertTime(a))}</time>${icon(s.icon)}
      <div><b>${esc(a.bed)}</b><p class="sub">${esc(a.body)}</p></div></li>`;
  }).join('') : '<li><p class="empty-note">還沒有推播紀錄</p></li>';
}

// ===== 啟動 =====
if (DEMO) {
  const now = Date.now() / 1000;
  alerts = [
    { bed: '301 病房 B 床', state: 'empty', body: '第二階段：點滴即將耗盡，請立即更換！', t: now - 40, url: 'http://192.168.1.51/' },
    { bed: '302 病房 A 床', state: 'low', body: '第一階段：液量偏低，請準備更換點滴。', t: now - 600, url: 'http://192.168.1.52/' },
    { bed: '301 病房 B 床', state: 'low', body: '第一階段：液量偏低，請準備更換點滴。', t: now - 1500, url: 'http://192.168.1.51/' },
    { bed: '301 病房 A 床', state: 'normal', body: '液位已恢復正常（已更換或已排除）。', t: now - 3600, url: 'http://192.168.1.50/' },
    { bed: '301 病房 A 床', state: 'test', body: '已連結這支手機，之後點滴警報會推播到這裡。', t: now - 7200, url: 'http://192.168.1.50/' },
    { bed: '301 病房 B 床', state: 'test', body: '已連結這支手機，之後點滴警報會推播到這裡。', t: now - 7300, url: 'http://192.168.1.51/' },
  ];
}

$('pushBtn').addEventListener('click', enablePush);
$('testBtn').addEventListener('click', testNotification);
$('pairBtn').addEventListener('click', onPairClick);
$('ipInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') onPairClick(); });
$('clearBtn').addEventListener('click', clearAlerts);
$('devList').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-ip]');
  if (!b) return;
  if (b.dataset.act === 'relink') return pair(b.dataset.ip, false);
  if (confirm(`確定要移除 ${b.dataset.ip}？這支手機將不再收到它的警報。`)) pair(b.dataset.ip, true);
});

const refresh = () => loadAlerts().then(render);
if (pushSupported) {
  navigator.serviceWorker.register('sw.js').then(refresh, refresh);
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'alert') refresh(); });
} else {
  refresh();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(render, 60000);  // 更新「幾分鐘前」
</script>
